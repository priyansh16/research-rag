# Full stack from a fresh clone: API + Ollama, with the model pulled on first start.
#
#   docker compose up --build
#
# On a Mac, Ollama in Docker runs on the CPU only (no Metal GPU), so answers are
# slow. To use the Ollama app running natively on the host instead:
#
#   docker compose -f compose.yaml -f compose.host-ollama.yaml up --build
#
# Data lives in named volumes (empty on first start; upload PDFs through the API).
# `docker compose down` keeps them; `docker compose down -v` deletes them.

name: research-rag

services:
  ollama:
    image: ollama/ollama:0.40.2
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the generation model into the ollama volume, then exits.
  # Fast after the first run (the model is already in the volume).
  ollama-pull:
    image: ollama/ollama:0.40.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # CPU-only Ollama is slow; the default 60 s can time out on long prompts.
      OLLAMA_TIMEOUT_SECONDS: "300"
      DATABASE_PATH: /app/storage/rag.db
      CHROMA_DB_DIR: /app/storage/chroma_db
      DEBUG: "false"
    volumes:
      - storage:/app/storage      # SQLite metadata + Chroma vectors
      - uploads:/app/data         # uploaded PDFs
      - hf-cache:/models/hf       # embedding, reranker and layout models
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama-models:
  storage:
  uploads:
  hf-cache:
